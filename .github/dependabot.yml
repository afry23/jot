version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)", prefix-development: "build(deps-dev)" }
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (native) is not yet compatible with the Svelte/Vite toolchain
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      svelte-kit:
        patterns: ["svelte", "@sveltejs/*", "vite", "svelte-check"]
      codemirror:
        patterns: ["@codemirror/*", "codemirror"]
      prosemirror:
        patterns: ["prosemirror-*"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)" }
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }
    groups:
      actions:
        patterns: ["*"]

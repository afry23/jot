version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)", prefix-development: "build(deps-dev)" }
    groups:
      svelte-kit:
        patterns: ["svelte", "@sveltejs/*", "vite", "svelte-check"]
      codemirror:
        patterns: ["@codemirror/*", "codemirror"]
      prosemirror:
        patterns: ["prosemirror-*"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)" }
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }

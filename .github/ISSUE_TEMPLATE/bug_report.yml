name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, what happened instead?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: dropdown
    id: os
    attributes:
      label: Platform
      options: [macOS, Windows, Linux, Android]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Jot version
      placeholder: "0.3.3"
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove anything private before pasting.
      render: shell
